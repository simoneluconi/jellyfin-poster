<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Jellyfin Cinema Poster</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&family=Bebas+Neue&display=swap" rel="stylesheet">

    <style>
        /* --- GLOBAL RESET --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --primary: #00A4DC; /* Jellyfin Blue */
            --accent: #E50914;  /* Cinema Red */
            --crossfade: 1.4s;
        }

        body, html {
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Montserrat', sans-serif;
            color: white;
        }

        /* 1. SLIDES: two stacked layers; the new one fades in over the old one (crossfade, no black) */
        #stage {
            position: absolute; inset: 0;
            z-index: 1;
        }

        .slide {
            position: absolute; inset: 0;
            overflow: hidden;
            opacity: 0;
            z-index: 0;
        }
        .slide.active {
            opacity: 1; z-index: 2;
            transition: opacity var(--crossfade) ease-in-out;
        }
        .slide.leaving { opacity: 1; z-index: 1; }

        /* Blurred background: oversized so blurred edges stay opaque (keeps the crossfade clean) */
        .bg-layer {
            position: absolute; inset: -150px;
            background-size: cover; background-position: center;
            filter: blur(60px) brightness(0.4);
            z-index: 1;
        }

        /* 2. TOP HEADER (Now Playing) */
        #top-bar {
            position: absolute; top: 0; left: 0; right: 0;
            height: 16vh;
            background: linear-gradient(to bottom, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.45) 45%, rgba(0,0,0,0) 100%);
            z-index: 50;
            display: flex; justify-content: center; align-items: flex-start;
            padding-top: 2.2vh;
            opacity: 0; transition: opacity 0.5s;
            pointer-events: none;
        }

        /* Cinema marquee sign: gold frame, chasing light bulbs, glowing letters */
        #marquee {
            position: relative;
            padding: 22px 46px 20px;
            border-radius: 12px;
            background: linear-gradient(180deg, #2b1709 0%, #160b04 100%);
            border: 2px solid #b98a3c;
            box-shadow:
                0 0 0 4px rgba(0, 0, 0, 0.65),          /* dark outer rim */
                0 0 0 5px rgba(185, 138, 60, 0.45),      /* thin second gold line */
                0 12px 40px rgba(0, 0, 0, 0.75),
                0 0 36px rgba(255, 170, 60, 0.28),       /* warm light spill */
                inset 0 0 20px rgba(0, 0, 0, 0.85);
        }

        /* Rows of bulbs: dim bulbs everywhere + a lit layer that steps by one bulb (chase effect) */
        .bulbs {
            position: absolute; left: 16px; right: 16px; height: 12px;
            background-image:
                radial-gradient(circle, #fff6d0 0 2.5px, rgba(255, 196, 100, 0.95) 3.5px, rgba(255, 160, 60, 0) 6px),
                radial-gradient(circle, rgba(255, 196, 110, 0.28) 0 2.5px, rgba(255, 196, 110, 0) 3.5px);
            background-size: 28px 12px, 14px 12px;
            background-repeat: repeat-x;
            background-position: -7px 50%, 0 50%;
            filter: drop-shadow(0 0 3px rgba(255, 180, 80, 0.9));
            animation: chase 0.8s steps(2) infinite;
        }
        .bulbs.top { top: 4px; }
        .bulbs.bottom { bottom: 4px; animation-direction: reverse; }
        @keyframes chase {
            from { background-position: -7px 50%, 0 50%; }
            to   { background-position: 21px 50%, 0 50%; }
        }

        #status-label {
            display: block;
            font-family: 'Bebas Neue', sans-serif; font-size: 2.7rem; line-height: 1;
            letter-spacing: 10px; padding-left: 10px; /* balance the trailing letter-spacing */
            color: #fff5da;
            text-shadow:
                0 0 6px rgba(255, 214, 140, 0.9),
                0 0 18px rgba(255, 160, 60, 0.65),
                0 0 42px rgba(255, 120, 30, 0.4);
            animation: glow 4s ease-in-out infinite;
        }
        @keyframes glow { 0%, 100% { opacity: 1; } 50% { opacity: 0.88; } }

        /* Paused playback: "intermission", lights stop and dim */
        #top-bar.paused .bulbs { animation-play-state: paused; opacity: 0.35; filter: none; }
        #top-bar.paused #status-label {
            animation: none; color: #d8ccb4;
            text-shadow: 0 0 6px rgba(255, 214, 140, 0.35);
        }
        #top-bar.paused #marquee { box-shadow: 0 0 0 4px rgba(0,0,0,0.65), 0 0 0 5px rgba(185,138,60,0.3),
                                               0 12px 40px rgba(0,0,0,0.75), inset 0 0 20px rgba(0,0,0,0.85); }

        /* 3. POSTER CONTAINER */
        .poster-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: flex-start;
            padding-top: 5vh;
            z-index: 5;
        }

        .poster-image {
            height: 95vh;
            width: auto; max-width: 95vw;
            object-fit: contain;
            box-shadow: 0 10px 60px rgba(0,0,0,0.8);
            transform: scale(1);
        }

        /* 4. GRADIENT OVERLAY (Text protection) */
        .gradient-overlay {
            position: absolute; bottom: 0; left: 0; width: 100%;
            height: 50vh;
            background: linear-gradient(to top, rgba(0,0,0,1) 10%, rgba(0,0,0,0.8) 40%, transparent 100%);
            z-index: 10;
        }

        /* 5. INFO LAYER */
        .info-layer {
            position: absolute; bottom: 30px; left: 0; width: 100%;
            z-index: 20;
            text-align: center;
            color: #ffffff !important;
            padding: 0 20px;
            transition: opacity 0.5s ease-out;
        }
        /* The outgoing slide's text fades out quickly so old and new titles never overlap */
        .slide:not(.active) .info-layer { opacity: 0; }

        h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 5rem; line-height: 0.9; margin-bottom: 12px;
            color: #ffffff;
            text-shadow: 2px 2px 0px #000, 0 0 30px rgba(0,0,0,0.8);
        }

        /* Title logo (from Jellyfin), replaces the text title when available */
        .title-logo {
            display: none;
            max-width: min(80vw, 60vh); max-height: 12vh;
            margin: 0 auto 16px;
            object-fit: contain;
            filter: drop-shadow(0 0 25px rgba(0,0,0,0.9)) drop-shadow(2px 2px 2px rgba(0,0,0,0.7));
        }
        .info-layer.has-logo .title-logo { display: block; }
        .info-layer.has-logo .title { display: none; }

        /* No title when it's already printed on the poster (SHOW_TITLE=auto) or SHOW_TITLE=False */
        .info-layer.no-title .title, .info-layer.no-title .title-logo { display: none !important; }

        .tagline {
            font-style: italic; font-weight: 300; font-size: 1.3rem;
            color: #dddddd; margin-bottom: 8px;
            text-shadow: 1px 1px 2px #000;
        }

        /* TV episodes: "S01E02 · Episode title", below the series title */
        .episode-info {
            font-weight: 500; font-size: 1.5rem; letter-spacing: 1px;
            color: #eeeeee; margin-bottom: 12px;
            text-shadow: 1px 1px 3px #000;
        }
        .episode-info:empty { display: none; }

        .meta-row {
            display: flex; justify-content: center; align-items: center; gap: 15px;
            margin-bottom: 15px;
            font-size: 1.1rem; color: #eeeeee;
            text-shadow: 1px 1px 4px #000; font-weight: 600;
        }

        .badge {
            border: 1px solid rgba(255,255,255,0.5);
            background: rgba(0,0,0,0.3);
            padding: 3px 10px; border-radius: 4px;
            font-size: 0.85rem; font-weight: 700;
        }

        /* 6. PROGRESS BAR */
        #progress-container {
            position: absolute; bottom: 0; left: 0; right: 0;
            height: 8px; background: rgba(255,255,255,0.15);
            z-index: 100;
        }

        #progress-fill {
            height: 100%; width: 0%;
            background: var(--primary);
            box-shadow: 0 0 20px var(--primary);
        }

        .time-label {
            position: absolute; bottom: 15px;
            font-weight: 700; font-size: 1.1rem; color: #ffffff;
            text-shadow: 2px 2px 4px #000;
            opacity: 0; transition: opacity 0.5s; z-index: 101;
        }
        #t-curr { left: 20px; }
        #t-tot { right: 20px; }

        /* Vertical Monitor Support */
        @media (aspect-ratio: 9/16) {
            .poster-image { height: 75vh; }
            h1 { font-size: 4rem; }
            .title-logo { max-width: 80vw; max-height: 11vh; }
            .gradient-overlay { height: 45vh; }
            .info-layer { bottom: 50px; }
        }
    </style>
</head>
<body>

    <div id="top-bar">
        <div id="marquee">
            <div class="bulbs top"></div>
            <span id="status-label">NOW PLAYING</span>
            <div class="bulbs bottom"></div>
        </div>
    </div>

    <div id="stage">
        <template id="slide-template">
            <div class="slide">
                <div class="bg-layer"></div>
                <div class="poster-container">
                    <img class="poster-image" src="" alt="">
                </div>
                <div class="gradient-overlay"></div>
                <div class="info-layer">
                    <div class="tagline"></div>
                    <img class="title-logo" src="" alt="">
                    <h1 class="title"></h1>
                    <div class="episode-info"></div>
                    <div class="meta-row"></div>
                </div>
            </div>
        </template>
    </div>

    <span class="time-label" id="t-curr">0:00</span>
    <span class="time-label" id="t-tot">0:00</span>

    <div id="progress-container">
        <div id="progress-fill"></div>
    </div>

    <script>
        const RANDOM_DURATION = {{ poster_duration_ms }};  // from POSTER_DURATION in .env
        const ZOOM_DURATION = RANDOM_DURATION * 0.6;
        const CROSSFADE_DURATION = 1400;  // keep in sync with --crossfade in CSS
        const PLAYING_CHECK_INTERVAL = 3000;
        const RETRY_DELAY = 5000;

        // Unique per browser tab, survives reloads: lets the server tell screens apart (sync mode)
        const SCREEN_ID = (() => {
            const make = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
            try {
                let id = sessionStorage.getItem('poster-screen-id');
                if (!id) { id = make(); sessionStorage.setItem('poster-screen-id', id); }
                return id;
            } catch (e) { return make(); }
        })();

        let currentMode = null;
        let currentId = null;
        let transitioning = false;
        let startTime;
        let animationFrame = null;
        let nextTimer = null;
        let pollTimer = null;

        const elStage = document.getElementById('stage');
        const elFill = document.getElementById('progress-fill');
        const elTopBar = document.getElementById('top-bar');
        const elStatus = document.getElementById('status-label');
        const elTCurr = document.getElementById('t-curr');
        const elTTot = document.getElementById('t-tot');

        // Marquee: size the bulb rows to a whole number of bulbs, centered, so none is cut at the edges
        const elMarquee = document.getElementById('marquee');
        const BULB_SPACING = 14;  // keep in sync with the dim bulb background-size in CSS
        new ResizeObserver(() => {
            const width = elMarquee.clientWidth;
            const row = Math.floor((width - 24) / BULB_SPACING) * BULB_SPACING;
            elMarquee.querySelectorAll('.bulbs').forEach(b => {
                b.style.left = b.style.right = `${(width - row) / 2}px`;
            });
        }).observe(elMarquee);

        // Two slides used alternately: one on screen, one receiving the next poster
        const slideTemplate = document.getElementById('slide-template');
        const slides = [0, 1].map(() => {
            const slide = slideTemplate.content.firstElementChild.cloneNode(true);
            elStage.appendChild(slide);
            return slide;
        });
        let activeIndex = 1;  // so the first poster goes into slides[0]

        async function api(path) {
            const response = await fetch(`${path}?screen=${encodeURIComponent(SCREEN_ID)}`);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return response.json();
        }

        function scheduleNext(ms) {
            clearTimeout(nextTimer);
            nextTimer = setTimeout(fetchNext, ms);
        }

        function stopTimers() {
            clearTimeout(nextTimer);
            clearInterval(pollTimer);
            if (animationFrame) cancelAnimationFrame(animationFrame);
            nextTimer = pollTimer = animationFrame = null;
        }

        async function fetchNext() {
            try {
                handleData(await api('/api/next'));
            } catch (e) { scheduleNext(RETRY_DELAY); }
        }

        // While the carousel runs, check often if something started playing
        async function pollNowPlaying() {
            if (currentMode !== 'random' || transitioning) return;
            try {
                const data = await api('/api/now-playing');
                if (data.mode === 'playing' && currentMode === 'random' && !transitioning) transitionTo(data);
            } catch (e) { /* ignore, next poll will retry */ }
        }

        function handleData(data) {
            if (data.mode === 'playing' && currentMode === 'playing' && data.id === currentId) {
                updateLiveStats(data);
                scheduleNext(PLAYING_CHECK_INTERVAL);
                return;
            }
            transitionTo(data);
        }

        function preload(url) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = url;
            });
        }

        async function transitionTo(data) {
            if (transitioning) return;
            transitioning = true;
            stopTimers();

            try {
                await preload(data.image_url);
            } catch (e) {
                transitioning = false;
                scheduleNext(RETRY_DELAY);
                return;
            }
            let hasLogo = false;
            if (data.logo_url) {
                try { await preload(data.logo_url); hasLogo = true; } catch (e) { /* fall back to text title */ }
            }

            const outgoing = slides[activeIndex];
            const incoming = slides[1 - activeIndex];
            activeIndex = 1 - activeIndex;

            // Prepare the incoming slide while it's still invisible
            fillSlide(incoming, data, hasLogo);
            const poster = incoming.querySelector('.poster-image');
            poster.style.transition = 'none';
            poster.style.transform = 'scale(1.0)';
            incoming.classList.remove('leaving');
            void incoming.offsetWidth;

            // Crossfade: the old slide stays fully visible underneath while the new one fades in
            if (outgoing.classList.contains('active')) {
                outgoing.classList.remove('active');
                outgoing.classList.add('leaving');
            }
            incoming.classList.add('active');

            // Start Zoom Animation
            poster.style.transition = `transform ${ZOOM_DURATION}ms ease-out`;
            poster.style.transform = 'scale(1.08)';

            // Progress bar / Now Playing header
            elFill.style.transition = 'none';
            elFill.style.width = '0%';
            currentMode = data.mode;
            currentId = data.id;
            configureMode(data);
            void elFill.offsetWidth;
            elFill.style.transition = 'width 0.2s linear';

            setTimeout(() => {
                outgoing.classList.remove('leaving');
                transitioning = false;
                if (currentMode === 'playing') scheduleNext(PLAYING_CHECK_INTERVAL);
                else startTimer();
            }, CROSSFADE_DURATION);
        }

        function configureMode(data) {
            if (data.mode === 'playing') {
                elTopBar.style.opacity = 1;
                elTCurr.style.opacity = 1;
                elTTot.style.opacity = 1;
                elFill.style.backgroundColor = 'var(--accent)';
                elFill.style.boxShadow = '0 0 20px var(--accent)';
                updateLiveStats(data);
            } else {
                elTopBar.style.opacity = 0;
                elTCurr.style.opacity = 0;
                elTTot.style.opacity = 0;
                elFill.style.backgroundColor = 'var(--primary)';
                elFill.style.boxShadow = '0 0 20px var(--primary)';
            }
        }

        function updateLiveStats(data) {
            elFill.style.width = data.progress_percent + '%';
            elTCurr.innerText = data.time_current;
            elTTot.innerText = data.time_total;
            elTopBar.classList.toggle('paused', !!data.paused);
            elStatus.innerText = data.paused ? 'INTERMISSION' : 'NOW PLAYING';
        }

        function fillSlide(slide, data, hasLogo) {
            const q = sel => slide.querySelector(sel);

            q('.bg-layer').style.backgroundImage = `url('${data.image_url}')`;
            q('.poster-image').src = data.image_url;
            q('.title').innerText = data.title;
            q('.title-logo').src = hasLogo ? data.logo_url : '';
            q('.title-logo').alt = data.title;
            q('.info-layer').classList.toggle('has-logo', hasLogo);
            q('.info-layer').classList.toggle('no-title', data.show_title === false);

            q('.tagline').innerText = data.tagline ? `"${data.tagline}"` : '';
            q('.episode-info').textContent = data.episode_info || '';

            // Meta row: only non-empty values, separated by bullets
            const meta = q('.meta-row');
            meta.replaceChildren();
            const parts = [
                { text: data.year },
                { text: data.resolution, badge: true },
                { text: data.audio },
                { text: data.duration_badge },
            ].filter(p => p.text);
            parts.forEach((p, i) => {
                if (i > 0) meta.append('•');
                const span = document.createElement('span');
                if (p.badge) span.className = 'badge';
                span.textContent = p.text;
                meta.append(span);
            });
        }

        function startTimer() {
            startTime = Date.now();
            elFill.style.width = '0%';
            function step() {
                if (currentMode !== 'random' || transitioning) return;
                const elapsed = Date.now() - startTime;
                const pct = Math.min((elapsed / RANDOM_DURATION) * 100, 100);
                elFill.style.width = pct + '%';
                if (elapsed < RANDOM_DURATION) animationFrame = requestAnimationFrame(step);
                else { stopTimers(); fetchNext(); }
            }
            animationFrame = requestAnimationFrame(step);
            pollTimer = setInterval(pollNowPlaying, PLAYING_CHECK_INTERVAL);
        }

        // Free this screen's slot right away when the page is closed (sync mode)
        window.addEventListener('pagehide', () => {
            navigator.sendBeacon(`/api/release?screen=${encodeURIComponent(SCREEN_ID)}`);
        });

        fetchNext();
    </script>
</body>
</html>
